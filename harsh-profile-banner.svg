<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Harsh Kochar — Developer Profile</title>
  <desc id="desc">A futuristic neon-green developer dashboard showing Harsh Kochar's work across full-stack development, AI and mobile apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120c"/>
      <stop offset="0.55" stop-color="#020906"/>
      <stop offset="1" stop-color="#071b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="90%" r="75%">
      <stop offset="0" stop-color="#00ff72" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#00ff72" stop-opacity=".06"/>
      <stop offset="1" stop-color="#00ff72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25ff83"/>
      <stop offset="1" stop-color="#00a94f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1cff79" opacity=".18"/>
    </pattern>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#14d96b" stroke-width="1" opacity=".12"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="24" fill="url(#glow)"/>
  <rect width="1600" height="560" rx="24" fill="url(#dots)"/>
  <rect x="1.5" y="1.5" width="1597" height="557" rx="23" fill="none" stroke="#16d96d" stroke-opacity=".55" stroke-width="2"/>
  <path d="M22 54V22H56 M1544 22H1578V56 M22 504V538H56 M1544 538H1578V504" fill="none" stroke="#28ff84" stroke-width="4"/>

  <!-- left identity monogram -->
  <circle cx="190" cy="260" r="139" fill="#03100a" stroke="#0b8042" stroke-width="2"/>
  <circle cx="190" cy="260" r="126" fill="none" stroke="#25ff83" stroke-width="3"/>
  <circle cx="190" cy="260" r="111" fill="#071b10" stroke="#145d36" stroke-width="1.5"/>
  <circle cx="190" cy="260" r="97" fill="url(#grid)" opacity=".8"/>
  <text x="190" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-5" fill="#e8fff1">HK</text>
  <path d="M190 120 A140 140 0 0 1 318 232" fill="none" stroke="#2cff86" stroke-width="5" filter="url(#softGlow)"/>
  <path d="M64 260 A126 126 0 0 0 190 386" fill="none" stroke="#0e9a4d" stroke-width="2"/>

  <!-- main identity -->
  <g font-family="'Courier New', monospace">
    <text x="390" y="128" font-size="66" font-weight="800" letter-spacing="4" fill="#effff4">HARSH</text>
    <text x="390" y="199" font-size="66" font-weight="800" letter-spacing="4" fill="#effff4">KOCHAR</text>
    <text x="392" y="244" font-size="27" font-weight="700" fill="#28ff83">@HarshKochar9008</text>

    <rect x="392" y="270" width="210" height="42" rx="7" fill="#071b10" stroke="#1cff79" stroke-width="2"/>
    <circle cx="416" cy="291" r="8" fill="#28ff83"/>
    <text x="436" y="299" font-size="18" font-weight="700" letter-spacing="2" fill="#28ff83">BUILD MODE</text>
    <text x="625" y="299" font-size="20" font-weight="700" fill="#e9fff1">⌖  Mumbai, India</text>

    <text x="392" y="374" font-size="37" font-weight="800" letter-spacing="1.5" fill="#27ff83">/ BUILDING PRODUCTS WITH</text>
    <text x="418" y="421" font-size="37" font-weight="800" letter-spacing="1.5" fill="#27ff83">AI, WEB &amp; MOBILE</text>
    <text x="418" y="464" font-size="22" font-weight="700" fill="#eafff0">Full-Stack Developer  /  AI Engineer  /  Product Builder</text>
    <text x="418" y="510" font-size="18" fill="#8db49b">&gt; turning ideas into useful software, one build at a time_</text>
  </g>

  <!-- right orbital/engineering illustration -->
  <g transform="translate(1190 245)" fill="none" stroke="url(#line)">
    <circle r="144" stroke-width="1.5" opacity=".45"/>
    <circle r="112" stroke-width="1.2" opacity=".55" stroke-dasharray="5 11"/>
    <ellipse rx="174" ry="72" transform="rotate(-24)" stroke-width="2" stroke-dasharray="6 12" opacity=".85"/>
    <path d="M-158 0H158 M0-158V158 M-112-112L112 112 M112-112L-112 112" stroke-width="1" opacity=".2"/>
    <circle r="73" fill="#0b351f" fill-opacity=".75" stroke="#27ff83" stroke-width="2"/>
    <path d="M-52 -3Q-25 -29 0 -22Q25 -32 52 -3Q28 33 0 29Q-30 36 -52 -3Z" stroke-width="1.5" opacity=".85"/>
    <path d="M-44 -4H44 M0 -67V67 M-25 -57Q-4 -4 -25 57 M25 -57Q4 -4 25 57" stroke-width="1" opacity=".6"/>
    <circle cx="-152" cy="-58" r="5" fill="#27ff83"/>
    <circle cx="150" cy="55" r="5" fill="#27ff83"/>
  </g>
  <g transform="translate(1035 405)" fill="none" stroke="#28ff83" stroke-width="3" opacity=".95">
    <path d="M0 42L89 0H222L132 44Z"/>
    <path d="M0 42V54L132 56V44"/>
    <path d="M89 0V13L222 13"/>
    <path d="M132 44L132 56"/>
    <path d="M99 10H204" stroke-width="1.4" opacity=".7"/>
    <path d="M132 20L145 33L158 20" stroke-width="2"/>
  </g>
  <g font-family="'Courier New', monospace" text-anchor="end">
    <text x="1510" y="70" font-size="17" font-weight="700" letter-spacing="2" fill="#95bca3">DEVELOPER VIEW // GITHUB</text>
    <text x="1510" y="105" font-size="17" font-weight="700" letter-spacing="2" fill="#28ff83">FOCUS : FULL-STACK + AI</text>
    <text x="1510" y="134" font-size="17" font-weight="700" letter-spacing="2" fill="#28ff83">MODE  : BUILDING</text>
  </g>

  <!-- accent marks -->
  <path d="M85 430L106 405H126L105 430H85ZM120 430L141 405H161L140 430H120ZM155 430L176 405H196L175 430H155Z" fill="#28ff83"/>
  <path d="M1000 548Q1190 430 1600 468" fill="none" stroke="#1cff79" stroke-width="2" opacity=".25"/>
</svg>
